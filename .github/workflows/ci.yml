name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate puja-data.json
        run: node tools/validate-data.js data/puja-data.json

      - name: Run unit tests
        run: node tests/unit.js
