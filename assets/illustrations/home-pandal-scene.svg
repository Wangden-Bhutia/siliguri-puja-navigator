<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
