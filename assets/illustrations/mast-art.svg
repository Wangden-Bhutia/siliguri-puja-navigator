<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="warmGlow" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8b84a" stop-opacity=".45"/>
      <stop offset="45%" stop-color="#c45a2a" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#5a0f1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a050a" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#0d0205" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <!-- warm glow behind art -->
  <ellipse cx="155" cy="55" rx="90" ry="70" fill="url(#warmGlow)"/>
  <!-- subtler mandala (far left of art panel) -->
  <g opacity=".12" stroke="#e3c36f" stroke-width="0.5" transform="translate(8,10)">
    <circle cx="36" cy="36" r="34"/>
    <circle cx="36" cy="36" r="26"/>
    <circle cx="36" cy="36" r="18"/>
    <circle cx="36" cy="36" r="10"/>
    <path d="M36 2v68M2 36h68"/>
    <path d="M12 12l48 48M12 60l48-48"/>
    <path d="M36 2c12 10 20 20 20 34S48 60 36 70C24 60 16 50 16 36S24 12 36 2z"/>
  </g>
  <!-- crescent + Durga -->
  <g transform="translate(105,6)" stroke-linecap="round" stroke-linejoin="round">
    <!-- crescent glow -->
    <path d="M86 22c-1-16-14-28-30-28-3 0-6 .4-8.5 1.2 10 1.5 18 11 18 22.8S57.5 40 47.5 41.5c2.5.8 5.5 1.2 8.5 1.2 18 0 31.5-9 30-20.7z"
          fill="#e3c36f" fill-opacity=".15" stroke="#e3c36f" stroke-width="1.6"/>
    <path d="M86 22c-1-16-14-28-30-28-3 0-6 .4-8.5 1.2 10 1.5 18 11 18 22.8S57.5 40 47.5 41.5c2.5.8 5.5 1.2 8.5 1.2 18 0 31.5-9 30-20.7z"
          fill="none" stroke="#f0d78a" stroke-width=".7" opacity=".9"/>
    <!-- face -->
    <g stroke="#e3c36f" stroke-width="1.4">
      <ellipse cx="38" cy="58" rx="24" ry="30"/>
      <!-- crown base -->
      <path d="M18 34c4-6 12-12 20-14 8 2 16 8 20 14"/>
      <path d="M22 34c3-8 9-14 16-16 7 2 13 8 16 16" stroke-width="1"/>
      <!-- trident / mukut peak -->
      <path d="M38 4l-10 18h6l4-10 4 10h6z" fill="#e3c36f" fill-opacity=".2"/>
      <path d="M38 4v16" stroke-width="1.2"/>
      <path d="M30 14h16" stroke-width="1"/>
      <!-- third eye -->
      <path d="M38 40v10" stroke-width="1.2"/>
      <ellipse cx="38" cy="38" rx="2.2" ry="3" fill="#e3c36f" stroke="none"/>
      <!-- brows + eyes -->
      <path d="M22 52c5-5 12-6 16-2" stroke-width="1.5"/>
      <path d="M38 50c5-4 12-3 16 2" stroke-width="1.5"/>
      <path d="M24 56c4-2 8-2 12 0" stroke-width="1.1"/>
      <path d="M40 56c4-2 8-2 12 0" stroke-width="1.1"/>
      <circle cx="30" cy="57" r="1.3" fill="#e3c36f" stroke="none"/>
      <circle cx="46" cy="57" r="1.3" fill="#e3c36f" stroke="none"/>
      <!-- nose -->
      <path d="M38 60v12" stroke-width="1.2"/>
      <path d="M35 72h6" stroke-width="1"/>
      <!-- lips -->
      <path d="M30 78c4 5 12 5 16 0" stroke-width="1.4"/>
      <path d="M32 78c3 2 9 2 12 0" stroke-width=".9" opacity=".8"/>
      <!-- tilak / bindi ornaments -->
      <circle cx="38" cy="48" r="1" fill="#e3c36f" stroke="none"/>
      <!-- earrings -->
      <circle cx="14" cy="62" r="4" stroke-width="1.2"/>
      <circle cx="14" cy="62" r="1.5" fill="#e3c36f" fill-opacity=".35" stroke="none"/>
      <circle cx="62" cy="62" r="4" stroke-width="1.2"/>
      <circle cx="62" cy="62" r="1.5" fill="#e3c36f" fill-opacity=".35" stroke="none"/>
      <!-- necklace hint -->
      <path d="M22 82c8 10 24 10 32 0" stroke-width="1.1"/>
      <path d="M26 84c6 6 18 6 24 0" stroke-width=".8" opacity=".75"/>
    </g>
  </g>
  <!-- suspension bridge silhouette -->
  <g fill="url(#bridgeFill)" opacity=".9">
    <!-- deck -->
    <path d="M0 138h220v6H0z"/>
    <!-- towers -->
    <rect x="48" y="88" width="5" height="50"/>
    <rect x="148" y="88" width="5" height="50"/>
    <path d="M46 88h9v4h-9z"/><path d="M146 88h9v4h-9z"/>
    <!-- cables -->
    <path d="M50 92C78 92 95 128 110 138" stroke="#1a050a" stroke-width="1.6" fill="none"/>
    <path d="M50 92C30 100 16 124 8 138" stroke="#1a050a" stroke-width="1.6" fill="none"/>
    <path d="M150 92C122 92 105 128 90 138" stroke="#1a050a" stroke-width="1.6" fill="none"/>
    <path d="M150 92C170 100 190 124 212 138" stroke="#1a050a" stroke-width="1.6" fill="none"/>
    <!-- hangers -->
    <path d="M60 100v38M70 108v30M80 118v20M90 128v10M100 134v4" stroke="#1a050a" stroke-width="1" opacity=".8"/>
    <path d="M140 100v38M130 108v30M120 118v20M110 128v10" stroke="#1a050a" stroke-width="1" opacity=".8"/>
    <!-- hillside under -->
    <path d="M0 144c30-8 60-4 90 2s70 4 100-2 20-2 30 2v26H0z" opacity=".7"/>
  </g>
</svg>
